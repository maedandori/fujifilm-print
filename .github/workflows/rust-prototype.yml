name: Rust Print Agent (thử nghiệm)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: rust-test-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    name: Kiểm thử và build Rust trên Windows
    runs-on: windows-2022
    env:
      FUJIFILM_BUILD_VERSION: 0.4.${{ github.run_number }}
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4
      - name: Cài Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Kiểm thử
        run: cargo test --release
      - name: Build EXE tối ưu dung lượng
        run: cargo build --release
      - name: Chạy mô phỏng không in
        shell: pwsh
        run: |
          & ./target/release/fujifilm-print-rust.exe --simulate sample-job.json
          if ($LASTEXITCODE -ne 0) { throw 'Mô phỏng thất bại' }
      - name: Đo hiệu năng Rust và RAM khi chạy chờ
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path benchmark-output | Out-Null
          $exe = (Resolve-Path ./target/release/fujifilm-print-rust.exe).Path
          $size = (Get-Item $exe).Length
          $bench = & $exe --benchmark 100000
          if ($LASTEXITCODE -ne 0) { throw 'Benchmark thất bại' }
          $proc = Start-Process -FilePath $exe -ArgumentList '--idle-seconds','15' -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 2
          $p = Get-Process -Id $proc.Id -ErrorAction Stop
          $memory = $p.WorkingSet64
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          @(
            'Chỉ là số đo Rust trên GitHub Actions; KHÔNG phải so sánh C# trực tiếp.'
            ('EXE_bytes=' + $size)
            ('Idle_WorkingSet_bytes=' + $memory)
            ('Benchmark=' + ($bench -join ' '))
          ) | Set-Content -Encoding utf8 benchmark-output/results.txt
          Get-Content benchmark-output/results.txt
      - name: Đóng gói EXE thử nghiệm
        shell: pwsh
        run: |
          Copy-Item target/release/fujifilm-print-gui.exe benchmark-output/Fujifilm-Print-Rust-Test.exe
          Copy-Item target/release/fujifilm-print-rust.exe benchmark-output/Fujifilm-Print-Rust-CLI.exe
          Copy-Item target/release/print-agent-rust.exe benchmark-output/Print-Agent-Rust-Core.exe
          Copy-Item target/release/print-settings-rust.exe benchmark-output/Print-Settings-Rust.exe
          Copy-Item target/release/print-updater-rust.exe benchmark-output/Print-Updater-Rust.exe
          Copy-Item target/release/print-tray-rust.exe benchmark-output/Print-Agent-Rust.exe
          New-Item -ItemType Directory -Force -Path benchmark-output/scripts | Out-Null
          Copy-Item scripts/export-excel-pdf.ps1 benchmark-output/scripts/export-excel-pdf.ps1
          Copy-Item scripts/install-rust-update.ps1 benchmark-output/scripts/install-rust-update.ps1
          Copy-Item sample-job.json benchmark-output/sample-job.json
          Copy-Item README.md benchmark-output/README.md
      - name: Lưu artifact để tải bằng iPhone hoặc PC
        uses: actions/upload-artifact@v4
        with:
          name: Rust-Print-Agent-Windows-x64
          path: benchmark-output/
          retention-days: 30
      - name: Đóng gói bản cập nhật tự động Rust có SHA-256
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $items=@('Print-Agent-Rust.exe','Print-Agent-Rust-Core.exe','Print-Settings-Rust.exe','Print-Updater-Rust.exe','scripts/export-excel-pdf.ps1')
          foreach($item in $items){if(-not (Test-Path "benchmark-output/$item")){throw "Thiếu $item"}}
          New-Item -ItemType Directory -Force -Path update-package/scripts | Out-Null
          foreach($name in $items){
            $dest=Join-Path update-package $name
            Copy-Item -LiteralPath (Join-Path benchmark-output $name) -Destination $dest -Force
          }
          Push-Location update-package
          try {
            Compress-Archive -Path * -DestinationPath ../fujifilm-rust-update.zip -CompressionLevel Optimal
          } finally {Pop-Location}
          $hash=(Get-FileHash fujifilm-rust-update.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  fujifilm-rust-update.zip" | Set-Content -Encoding ascii fujifilm-rust-update.sha256
      - name: Phát hành bản Rust riêng để các máy tự cập nhật
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag="rust-v${{ env.FUJIFILM_BUILD_VERSION }}"
          gh release create $tag fujifilm-rust-update.zip fujifilm-rust-update.sha256 --title "Fujifilm Print Rust ${{ env.FUJIFILM_BUILD_VERSION }}" --notes "Bản Rust độc lập với C#. Kiểm tra SHA-256 trước khi cập nhật. Giữ config.ini, agent-id.txt, template và PDF." --latest --target "${{ github.sha }}"
