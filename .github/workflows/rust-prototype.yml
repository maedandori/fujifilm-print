name: Build Fujifilm Print Rust - 2 EXE
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: rust-two-exe-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    name: Build và kiểm thử Print Agent + Print Settings
    runs-on: windows-2022
    env:
      FUJIFILM_BUILD_VERSION: 0.5.${{ github.run_number }}
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4
      - name: Cài Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Kiểm thử Agent có icon máy in
        run: cargo test --release --bin print-tray-rust --features agent-icon
      - name: Kiểm thử Settings có icon bánh răng
        run: cargo test --release --bin print-settings-rust --features settings-icon
      - name: Kiểm tra cú pháp PowerShell 5.1 với UTF-8 BOM
        shell: powershell
        run: |
          $path=Join-Path (Get-Location) 'scripts/export-excel-pdf.ps1'
          $raw=[IO.File]::ReadAllBytes($path)
          $utf8=New-Object System.Text.UTF8Encoding($true)
          $encoded=$utf8.GetPreamble()+$raw
          $file=Join-Path $env:RUNNER_TEMP 'export-excel-pdf-utf8bom.ps1'
          [IO.File]::WriteAllBytes($file,$encoded)
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($file,[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count -ne 0){$errors | ForEach-Object {Write-Error $_.ToString()}; throw 'PowerShell parser lỗi'}
          Write-Host 'UTF-8 BOM và cú pháp PowerShell 5.1 OK'
      - name: Build Print Agent với icon máy in
        run: cargo build --release --bin print-tray-rust --features agent-icon
      - name: Build Print Settings với icon bánh răng
        run: cargo build --release --bin print-settings-rust --features settings-icon
      - name: Đóng gói hai EXE, không kèm binary phụ
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish | Out-Null
          Copy-Item target/release/print-tray-rust.exe publish/Print-Agent.exe
          Copy-Item target/release/print-settings-rust.exe publish/Print-Settings.exe
          $files=Get-ChildItem publish -File
          if($files.Count -ne 2){throw 'Gói phải có đúng 2 EXE'}
          $files | ForEach-Object { Write-Host ("{0} - {1} bytes" -f $_.Name,$_.Length) }
      - name: Xuất 2 EXE để tải thủ công
        uses: actions/upload-artifact@v4
        with:
          name: Fujifilm-Print-Rust-Two-EXE-Windows
          path: publish/
          retention-days: 30
      - name: Tạo gói cập nhật Rust chỉ chứa hai EXE
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          Compress-Archive -Path publish/Print-Agent.exe,publish/Print-Settings.exe -DestinationPath fujifilm-rust-update.zip -CompressionLevel Optimal
          $hash=(Get-FileHash fujifilm-rust-update.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  fujifilm-rust-update.zip" | Set-Content -Encoding ascii fujifilm-rust-update.sha256
      - name: Phát hành riêng bản Rust
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag="rust-v${{ env.FUJIFILM_BUILD_VERSION }}"
          gh release create $tag fujifilm-rust-update.zip fujifilm-rust-update.sha256 --title "Fujifilm Rust ${{ env.FUJIFILM_BUILD_VERSION }} - Two EXE" --notes "Chỉ Print-Agent.exe và Print-Settings.exe. Giữ nguyên config.ini, agent-id.txt và template." --latest --target "${{ github.sha }}"
